<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="app"></div>
    <script type="module">
      //   import {
      //     createRenderer,
      //     render,
      //     h,
      //     Text,
      //     Fragment
      //   } from '/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js'
      import { render, h, Text, Fragment } from './runtime-dom.js'
      const app = document.querySelector('.app')

      const VueComponent = {
        data() {
          return {
            name: 'hsh',
            age: 18
          }
        },
        render() {
          setTimeout(() => {
            debugger
            this.age++
            debugger
            this.age++
          }, 1000)
          return h('div', [h(Text, 'hello ' + this.name), h('a', this.age)])
        }
      }

      // 组件由两个虚拟节点组成
      // render函数返回的虚拟节点
      render(h(VueComponent), app)
    </script>
  </body>
</html>
