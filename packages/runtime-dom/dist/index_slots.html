<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="app"></div>
    <script type="module">
      import {
        createRenderer,
        render,
        h,
        Text,
        ref,
        Fragment
      } from '/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js'
      // import { render, h, Text, Fragment, ref } from './runtime-dom.js'
      const app = document.querySelector('.app')

      // setup 每个组件只会执行一次 可以放入我们的composition  api
      // 解决反复横跳问题

      const RenderComponent = {
        setup(props, { slots }) {
          return (proxy) => {
            return h(Fragment, [slots.footer('fff'), slots.header('hhh')])
          }
        }
      }

      const VueComponent = {
        // 提供渲染逻辑
        setup(props, { emit, attrs, expose }) {
          return (proxy) => {
            return h(RenderComponent, null, {
              header: (a) => h('header', `header   ` + a),
              main: () => h('main', 'main'),
              footer: () => h('footer', 'footer')
            })
          }
        }
      }

      // 组件由两个虚拟节点组成
      // render函数返回的虚拟节点
      render(h(VueComponent, {}), app)
    </script>
  </body>
</html>
