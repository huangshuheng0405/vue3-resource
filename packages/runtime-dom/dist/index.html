<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import {
        // createRenderer,
        // render,
        h
      } from '/node_modules/@vue/runtime-dom/dist/runtime-dom.esm-browser.js'
      import { render } from './runtime-dom.js'

      const ele = h('h1', [h('p', 'hello1'), h('button', 'hello2')])
      console.log('🚀 ~ ele:', ele)

      let ele2 = h('h1', { style: { color: 'green' } }, 'hsh')
      // const renderer = createRenderer(rendereeOptions)
      render(ele, app)
      console.log('🚀 ~ app:', app)

      setTimeout(() => {
        render(ele2, app)
      }, 3000)
    </script>
  </body>
</html>
